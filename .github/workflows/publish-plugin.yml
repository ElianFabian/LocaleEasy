name: Publish Gradle plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, such as 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-portal-${{ inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          version="$(sed -n 's/^localeEasy = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$version" || "$version" != "$RELEASE_TAG" ]]; then
            echo "::error::The release tag must match the LocaleEasy version in gradle/libs.versions.toml."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test the plugin
        run: bash ./gradlew -p locale-easy-gradle test validatePlugins --no-daemon

      - name: Publish to the Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [[ -z "$GRADLE_PUBLISH_KEY" || -z "$GRADLE_PUBLISH_SECRET" ]]; then
            echo "::error::Set GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET in the repository's Actions secrets."
            exit 1
          fi
          bash ./gradlew -p locale-easy-gradle publishPlugins --no-daemon --no-configuration-cache
